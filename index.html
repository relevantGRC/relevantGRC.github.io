<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathaniel Konu — Senior Compliance Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e11;
      --sidebar-bg: #13151a;
      --card-bg: #171a21;
      --card-hover: #1f232b;
      --accent: #8b5cf6;
      --accent-muted: rgba(139, 92, 246, 0.1);
      --accent-teal: #00f5d4; 
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dark: #64748b;
      --border: rgba(255, 255, 255, 0.04);
      --border-muted: rgba(255, 255, 255, 0.08);
      --mono: 'JetBrains Mono', monospace;
      --radius: 12px;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- SIDEBAR LAYOUT --- */
    aside {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 100;
      overflow-y: auto;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent-teal));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--bg);
    }

    .profile-meta .name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .profile-meta .title {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dark);
      margin: 16px 8px 8px 8px;
    }

    .sidebar-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .sidebar-nav a:hover, .sidebar-nav li.active a {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .sidebar-nav li.active a {
      border-left: 2px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding-left: 10px;
    }

    .sidebar-nav a .index {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dark);
    }

    .sidebar-hamburger {
      display: none;
    }

    /* --- MAIN CONTENT AREA --- */
    main {
      margin-left: 260px;
      flex: 1;
      padding: 80px 5% 40px 5%;
      max-width: 1200px;
    }

    /* --- CONTENT SWITCHING MECHANISM --- */
    .content-view {
      display: none; /* Hide all views by default */
      animation: fadeIn 0.3s ease-in-out;
    }

    .content-view.active-view {
      display: block; /* Show active view */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- HERO TYPE BLOCK --- */
    .hero-type-block {
      margin-bottom: 60px;
    }

    .hero-type-block h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 24px;
      color: var(--text);
    }

    .hero-type-block h1 span {
      color: var(--text-muted);
    }

    .hero-sub-text {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 720px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .hero-action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--text);
      color: var(--bg);
    }

    .btn-primary:hover {
      background-color: #e2e8f0;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border-muted);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* --- LAYOUT RUNWAYS (GRIDS) --- */
    .section-headline {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dark);
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    /* --- PRODUCT STYLE CARDS --- */
    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      border-color: var(--border-muted);
      transform: translateY(-2px);
    }

    .product-display {
      background: linear-gradient(180deg, #1e222b 0%, #13151a 100%);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .mock-window {
      background-color: #0d0e11;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.20);
    }

    .mock-header {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .mock-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-dark);
    }

    .product-details {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .product-info h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .product-info p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .product-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent-teal);
      background-color: rgba(0, 245, 212, 0.05);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* --- INFO ROW MATRIX --- */
    .info-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 24px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-val {
      font-size: 14px;
      font-weight: 500;
    }

    .info-val.highlight {
      color: var(--accent-teal);
    }

    /* --- EXPERIENCE & EDUCATION ITEMS --- */
    .clean-list-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.2s;
      margin-bottom: 12px;
    }

    .clean-list-item:hover {
      background-color: var(--card-hover);
    }

    .item-main h4 {
      font-size: 14px;
      font-weight: 600;
    }

    .item-main p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .item-meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dark);
    }

    /* --- FOOTER --- */
    footer {
      margin-top: 80px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dark);
    }

    /* --- RESPONSIVE ADAPTATIONS --- */
    @media (max-width: 968px) {
      aside {
        width: 100%;
        height: auto;
        bottom: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        position: relative;
        padding: 16px;
      }
      
      .profile-header {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .sidebar-nav, .nav-section-label {
        display: none;
      }

      .sidebar-nav.active {
        display: flex;
        margin-top: 16px;
      }

      .sidebar-hamburger {
        display: block;
        margin-left: auto;
        cursor: pointer;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 20px;
      }

      main {
        margin-left: 0;
        padding: 40px 24px;
      }
    }
  </style>
</head>

<body>

  <aside>
    <div class="profile-header">
      <div class="avatar">NK</div>
      <div class="profile-meta">
        <div class="name">Nathaniel Konu</div>
        <div class="title">Senior Compliance Engineer</div>
      </div>
